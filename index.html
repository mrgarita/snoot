<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101a38">
  <!-- iOS でホーム画面に追加したとき全画面（スタンドアロン）で起動させる -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Snoot">
  <title>Snoot</title>
  <!-- favicon：キャラ「ネムリ」（紫・寝息の z）。characters.ts の 16×16 スプライトを
       そのまま SVG の矩形へ写し、shape-rendering=crispEdges でドットのまま表示する -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Cg fill='%23a05bd8'%3E%3Crect x='5' y='3' width='6' height='1'/%3E%3Crect x='4' y='4' width='8' height='1'/%3E%3Crect x='3' y='5' width='10' height='2'/%3E%3Crect x='2' y='7' width='12' height='4'/%3E%3Crect x='3' y='11' width='10' height='2'/%3E%3Crect x='5' y='13' width='6' height='1'/%3E%3Crect x='7' y='14' width='2' height='1'/%3E%3C/g%3E%3Cg fill='%23dc97ff'%3E%3Crect x='5' y='4' width='2' height='1'/%3E%3Crect x='4' y='5' width='1' height='1'/%3E%3C/g%3E%3Cg fill='%231c2026'%3E%3Crect x='3' y='8' width='4' height='1'/%3E%3Crect x='9' y='8' width='4' height='1'/%3E%3Crect x='7' y='11' width='2' height='1'/%3E%3C/g%3E%3Cg fill='%23dfe6ff'%3E%3Crect x='10' y='1' width='3' height='1'/%3E%3Crect x='11' y='2' width='1' height='1'/%3E%3Crect x='10' y='3' width='3' height='1'/%3E%3C/g%3E%3C/svg%3E">
  <!-- base: "./" で相対配信する設計なので、ここもルート絶対パスにしない
       （/apple-touch-icon.png だと play/<名前>/ 配下から参照したとき 404 になる） -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- ウェブフォント：端末環境に依存せず見た目を統一する（Google Fonts・ゼロコスト）。
       オフライン時は Service Worker の実行時キャッシュ（vite.config.ts）から返す -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- ゲーム画面 -->
    <div id="game-screen" class="hidden">
      <div id="hud">
        <div id="hud-left">
          <span id="hud-difficulty"></span>
          <span id="hud-level"></span>
        </div>
        <div id="hud-danger">
          <span class="danger-label">DANGER</span>
          <div id="danger-bar"><div id="danger-fill"></div></div>
        </div>
        <div id="hud-right">
          <span id="hud-score">0</span>
          <button id="btn-quit" type="button">タイトルへ</button>
        </div>
      </div>
      <div id="canvas-wrap">
        <canvas id="game-canvas"></canvas>
      </div>
    </div>

    <!-- タイトル画面 -->
    <div id="title-screen">
      <!-- ロゴ：1 文字ずつ span 化して彩色・傾き・アニメを付け、中央の「oo」は
           ゲームキャラ 2 体の顔（main.ts の initLogo が drawSnoot で描画）に置き換える。
           読み上げは h1 の aria-label に一本化し、中身は装飾として隠す -->
      <h1 id="logo" aria-label="Snoot">
        <span class="logo-ch" aria-hidden="true">S</span>
        <span class="logo-ch" aria-hidden="true">n</span>
        <canvas class="logo-ch logo-face" data-snoot="0" width="192" height="192" aria-hidden="true"></canvas>
        <canvas class="logo-ch logo-face" data-snoot="4" width="192" height="192" aria-hidden="true"></canvas>
        <span class="logo-ch" aria-hidden="true">t</span>
      </h1>
      <p id="tagline">ねらって、つなげて、おとせ！</p>
      <div id="level-buttons">
        <button class="level-btn" data-level="easy" type="button">Easy</button>
        <button class="level-btn" data-level="normal" type="button">Normal</button>
        <button class="level-btn" data-level="hard" type="button">Hard</button>
        <button id="btn-highscore" type="button">ハイスコア</button>
      </div>
      <!-- 説明文は「文」を .help-line、その中の「文節」を .help-phrase で包む（#32）。
           スマホ幅でも句の途中では折り返さず、意味の切れ目だけで改行される。
           .help-phrase は inline-block なので、タグの間に空白を入れると余分な
           スペースとして出る。改行せず詰めて書くこと -->
      <p id="title-help">
        <span class="help-line">タップ／クリックで発射。</span>
        <span class="help-line"><span class="help-phrase">同じ顔が 3 つ</span><span class="help-phrase">つながると消える。</span></span>
        <span class="help-line">全部消せばクリア！</span>
      </p>
    </div>

    <!-- リザルトオーバーレイ（クリア／ゲームオーバー共用） -->
    <div id="result-overlay" class="hidden">
      <div id="result-box">
        <h2 id="result-title"></h2>
        <!-- クリア時の段階表示（②b・#28・#30）。ショット数→ボーナス内訳→合計スコアの順に
             出して「何をいくら獲得したか」を見せてから合計で締める。
             毎回出るクリアボーナスを先、獲得時のみのショットボーナスを後にする -->
        <div id="result-stats" class="hidden">
          <p class="stat-row" id="stat-shots"></p>
          <p class="stat-row stat-bonus" id="stat-clear-bonus"></p>
          <p class="stat-row stat-bonus" id="stat-bonus"></p>
          <p class="stat-row stat-total" id="stat-score"></p>
        </div>
        <p id="result-score"></p>
        <p id="result-best"></p>
        <div id="result-buttons">
          <button id="btn-retry" type="button">もう一度</button>
          <button id="btn-next" type="button">次のレベルへ</button>
          <button id="btn-title" type="button">タイトルへ</button>
        </div>
      </div>
    </div>

    <!-- 名前入力オーバーレイ（新記録達成時） -->
    <div id="name-entry-overlay" class="hidden">
      <div id="name-entry-box">
        <h2>新記録！</h2>
        <p id="name-entry-msg"></p>
        <input id="name-input" type="text" maxlength="8" autocomplete="off">
        <button id="btn-name-ok" type="button">登録</button>
      </div>
    </div>

    <!-- ハイスコア一覧オーバーレイ（難易度別 Top5） -->
    <div id="highscore-overlay" class="hidden">
      <div id="highscore-box">
        <h2>ハイスコア</h2>
        <div id="highscore-tables"></div>
        <button id="btn-highscore-close" type="button">閉じる</button>
      </div>
    </div>

    <!-- バージョン表示（project.txt step4：プレイ中バージョンの明示） -->
    <div id="version-badge"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
