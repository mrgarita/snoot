# 備忘録サイトと各バージョンのプレイ用ビルドを GitHub Pages へ公開する
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は最新のみ（古い実行はキャンセル）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得（全履歴・タグ込み）
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Node.js をセットアップ
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: サイトを組み立てる（備忘録＋各バージョンのビルド）
        run: |
          set -e
          VERSIONS="v0.1.0 v0.2.0 v0.3.0 v0.4.0 v0.5.0 v0.6.0 v0.7.0 v0.8.0 v0.8.1 v0.9.0 v0.9.1 v0.9.2 v0.9.3 v0.9.4 v0.9.5 v0.9.6 v0.9.7 v0.9.8 v0.9.9 v0.9.10 v0.9.11 v0.9.12 v0.9.13 v0.9.14 v0.9.15 v0.9.16 v0.9.17 v0.9.18 v0.9.19 v0.9.20 v0.9.21 v0.9.22 v0.9.23 v0.9.24 v0.9.25 v0.9.26 v1.0.0"
          LATEST="v1.0.0"

          # 備忘録サイトをルートに配置
          mkdir -p _site
          cp -r docs/site/. _site/
          touch _site/.nojekyll

          # 各バージョンを worktree で取り出してビルドし play/<tag>/ へ
          for v in $VERSIONS; do
            wt="$RUNNER_TEMP/build-$v"
            git worktree add "$wt" "$v"
            ( cd "$wt" && npm ci && npm run build )
            mkdir -p "_site/play/$v"
            cp -r "$wt/dist/." "_site/play/$v/"
            git worktree remove "$wt" --force
          done

          # オリジナルの見た目の最新版を play/original/ に配置
          mkdir -p _site/play/original
          cp -r "_site/play/$LATEST/." _site/play/original/

          # 見た目のバリエーション（デザイン案）をブランチからビルドして play/<名前>/ へ。
          # ゲームの中身は同じで意匠だけが違うため、版数体系（VERSIONS）とは別枠にする。
          # オリジナルの見た目は play/original/ が担当する
          DESIGNS="pixel:design/1a-pixel gloss:design/1b-solid mono:design/1c-mono"
          for d in $DESIGNS; do
            slug="${d%%:*}"
            branch="${d#*:}"
            wt="$RUNNER_TEMP/build-design-$slug"
            git fetch --no-tags origin "$branch"
            git worktree add "$wt" "origin/$branch"
            ( cd "$wt" && npm ci && npm run build )
            mkdir -p "_site/play/$slug"
            cp -r "$wt/dist/." "_site/play/$slug/"
            git worktree remove "$wt" --force
          done

          # play/latest/ は一番人気の「つやつや」が担当する（2026-09-20 にオリジナルから差し替え）。
          # つやつやは design/1b-solid ブランチ先端からビルドされるため、main をリリースしても
          # 同ブランチへ移植・push しない限り latest は古いままになる（release.mjs が警告する）
          mkdir -p _site/play/latest
          cp -r _site/play/gloss/. _site/play/latest/

      - name: Pages 設定（未設定なら自動で有効化）
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: アーティファクトをアップロード
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v5
